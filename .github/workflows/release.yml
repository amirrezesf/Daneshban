name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.2.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.prev_tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Find previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | awk 'NR==2 {print $1}')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog from commits
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configurationJson: |
            {
              "template": "# {{RELEASE_NAME}} ({{DATE}})\n\n## Changes\n{{CHANGES}}\n\n---\n*Full changelog: {{REPOSITORY_URL}}/compare/{{PREVIOUS_TAG}}...{{TAG_NAME}}*",
              "categories": [
                {"title": "🚀 Features", "labels": ["feat", "feature"]},
                {"title": "🐛 Bug Fixes", "labels": ["fix", "bugfix", "bug"]},
                {"title": "📝 Documentation", "labels": ["docs", "doc"]},
                {"title": "🔧 Maintenance", "labels": ["chore", "maintenance", "refactor", "style", "ci", "build", "test"]},
                {"title": "⚡ Performance", "labels": ["perf", "performance"]},
                {"title": "🔒 Security", "labels": ["security", "sec"]},
                {"title": "💥 Breaking Changes", "labels": ["breaking", "break"]}
              ],
              "excludeLabels": ["skip-changelog"],
              "includeLabels": [],
              "sortBy": "title",
              "maxIssues": 100
            }
          fromTag: ${{ steps.prev_tag.outputs.tag }}
          toTag: ${{ github.event.inputs.tag || github.ref_name }}

  docker:
    name: Build & Push Docker Image
    needs: generate-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ github.repository }}
            org.opencontainers.image.description=Daneshban - University Library Management System
            org.opencontainers.image.version=${{ needs.generate-changelog.outputs.version }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [generate-changelog, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-changelog.outputs.version }}
          name: Release v${{ needs.generate-changelog.outputs.version }}
          body: |
            ${{ needs.generate-changelog.outputs.changelog }}

            ## 🐳 Docker Installation

            ### Pull from GitHub Container Registry
            ```bash
            # Latest release
            docker pull ghcr.io/${{ github.repository }}:${{ needs.generate-changelog.outputs.version }}

            # Or latest tag
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            ### Run with Docker Compose (Recommended)
            ```bash
            # 1. Create environment file
            cp .env.example .env
            # Edit .env with your SECRET_KEY, ALLOWED_HOSTS, etc.

            # 2. Start services
            docker compose up --build -d
            ```

            ### Run Standalone Container
            ```bash
            docker run -d \
              --name daneshban \
              -p 2445:2445 \
              -e SECRET_KEY="your-secret-key" \
              -e DEBUG=False \
              -e ALLOWED_HOSTS="*" \
              -v $(pwd)/media:/app/media \
              -v $(pwd)/staticfiles:/app/staticfiles \
              ghcr.io/${{ github.repository }}:${{ needs.generate-changelog.outputs.version }}
            ```

            ### Health Check
            ```bash
            curl http://localhost:2445/health/
            # Returns: {"status": "healthy"}
            ```

            ### Admin User
            ```bash
            docker exec -it daneshban python manage.py createsuperuser
            ```

            ### Seed Demo Data
            ```bash
            docker exec -it daneshban python manage.py seed_demo
            ```

            ---
            *Image: ghcr.io/${{ github.repository }}:${{ needs.generate-changelog.outputs.version }} (Digest: ${{ needs.docker.outputs.image-digest }})*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}