{% extends 'base.html' %}

{% block title %}صفحه یافت نشد (خطای ۴۰۴){% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 600px; margin-inline: auto; margin-block: 4rem;">
  <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <h1 class="empty-state-title" style="font-size: 1.6rem;">صفحه مورد نظر پیدا نشد</h1>
  <p class="empty-state-desc">متأسفانه صفحه‌ای که به دنبال آن بودید یافت نشد یا ممکن است جابه‌جا یا حذف شده باشد.</p>
  <a href="{% url 'library:home' %}" class="btn btn-primary">بازگشت به صفحه اصلی</a>
</div>
{% endblock %}
