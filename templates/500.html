    <polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <h1 class="empty-state-title" style="font-size: 1.6rem;">خطای داخلی در پردازش درخواست</h1>

  <a href="{% url 'library:home' %}" class="btn btn-primary">بازگشت به صفحه اصلی</a>
</div>
{% endblock %}
