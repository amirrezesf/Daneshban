<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5856d6"/>
      <stop offset="1" stop-color="#0071e3"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0071e3"/>
      <stop offset="1" stop-color="#5856d6"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#1d1b6b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <rect x="101.500" y="101.500" width="821" height="821" rx="183.500" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Open book -->
  <g filter="url(#bookShadow)">
    <path d="M512 340 C450 300 360 295 290 315 L290 685 C360 665 450 670 512 710 Z" fill="#fff" fill-opacity="0.96"/>
    <path d="M512 340 C574 300 664 295 734 315 L734 685 C664 665 574 670 512 710 Z" fill="#fff" fill-opacity="0.88"/>
  </g>
  <line x1="512" y1="340" x2="512" y2="710" stroke="#5856d6" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Left page: handout lines -->
  <g fill="#5856d6" fill-opacity="0.38">
    <rect x="335" y="410" width="135" height="20" rx="10"/>
    <rect x="335" y="468" width="135" height="20" rx="10"/>
    <rect x="335" y="526" width="135" height="20" rx="10"/>
    <rect x="335" y="584" width="85" height="20" rx="10"/>
  </g>

  <!-- Right page: voice waveform -->
  <g fill="url(#wave)">
    <rect x="549" y="487" width="24" height="70" rx="12"/>
    <rect x="587" y="447" width="24" height="150" rx="12"/>
    <rect x="625" y="410" width="24" height="224" rx="12"/>
    <rect x="663" y="452" width="24" height="140" rx="12"/>
    <rect x="701" y="492" width="24" height="60" rx="12" transform="translate(-6 0)"/>
  </g>
</svg>
